<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<link rel="apple-touch-icon" href="icon.PNG">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>陰盤奇門排盤</title>
<style>
  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Base ── */
  body {
    background: #f5f0e8;
    font-family: "Noto Serif TC", "SimSun", "STSong", serif;
  }
  .page {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 10px 12px 32px;
    display: flex;
    flex-direction: column;
  }
  /* ══════════════════════════════════
     盤頭 Header  (3欄: 50 / 25 / 25)
  ══════════════════════════════════ */
  .header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: auto auto;
    border: 2px solid #111;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    margin-top: 0;
    margin-bottom: 16px;
    width: calc(100% - 12px);
    margin-left: auto;
    margin-right: auto;
  }

  .h-col-left  { grid-column: 1; grid-row: 1; border-right: 1px solid #ddd; padding: 6px 8px; }
  .h-col-left2 { grid-column: 1; grid-row: 2; border-right: 1px solid #ddd; border-top: 2px solid #111; padding: 4px 8px 6px; }
  .h-col-mid   { grid-column: 2 / 4; grid-row: 1; padding: 6px 8px; }
  .h-col-ref   { grid-column: 2 / 4; grid-row: 2; border-top: 2px solid #111; padding: 4px 8px 6px; }


  /* table 共用 */
  .h-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .h-table tr { line-height: 1.85; }
  .h-table td {
    font-family: "Noto Serif TC", serif;
    font-size: 11px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: middle;
  }
  /* 標籤欄（右對齊、灰色） */
  .h-table td.hl {
    color: #aaa;
    text-align: center;
    width: 2.5em;
  }
  /* 內容欄（置中） */
  .h-table td.hv {
    text-align: center;
    padding-left: 0;
    padding-right: 0;
  }

  /* ══════════════════════════════════
     九宮格外層 + 引干
  ══════════════════════════════════ */
  .outer {
    position: relative;
    width: calc(100% - 44px);
    aspect-ratio: 1 / 1;
    margin: 32px auto 20px;
  }

  /* 引干：8個方位 */
  .yigan {
    position: absolute;
    font-size: 15px;
    font-weight: normal;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .yigan-top    { top: -20px; left: 50%; transform: translateX(-50%); }
  .yigan-bottom { bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .yigan-left   { left: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-right  { right: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-tl { top: -20px; left: -16px; }
  .yigan-tr { top: -20px; right: -16px; }
  .yigan-bl { bottom: -20px; left: -16px; }
  .yigan-br { bottom: -20px; right: -16px; }

  /* ══════════════════════════════════
     九宮 Grid
  ══════════════════════════════════ */
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  /* 單格：3×3 九格佈局 */
  .cell {
    border: 1px solid #999;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    background: #fff;
  }
  /* ── 中宮：十二地支時鐘盤 ──
     中宮不顯示奇門符號，改用十二地支排列成時鐘圓盤。
     位置對應外圍八宮方位：子午卯酉在四正，辰巳／未申／戌亥／寅丑在四隅。
     用途：應期判斷——哪個宮位有動象，對應中宮同方向的地支即為應期時辰。
  */
  .cell.center { background: #eeebe3; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .dz-corner { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; font-size: 9px; color: #aaa; }
  .dz-corner span { display: flex; align-items: center; justify-content: center; }
  .dz-edge { font-size: 9px; color: #aaa; display: flex; align-items: center; justify-content: center; }
  .dz-wu  { align-items: flex-start !important; }  /* 午：靠上（南） */
  .dz-zi  { align-items: flex-end !important; }    /* 子：靠下（北） */
  .dz-mao { justify-content: flex-start !important; padding-left: 2px; }  /* 卯：靠左（東） */
  .dz-you { justify-content: flex-end !important; padding-right: 2px; }   /* 酉：靠右（西） */
  .dz-center { display: flex; align-items: center; justify-content: center; font-size: 13px; color: #bbb; }
  /* 中宮格線：col1 border-right, col3 border-left, row1+row2 border-bottom */
  .cell.center > div:nth-child(1) { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(2) { border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(3) { border-left: 1px solid #ccc; border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(4) { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(5) { border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(6) { border-left: 1px solid #ccc; border-bottom: 1px solid #ccc; }
  .cell.center > div:nth-child(7) { border-right: 1px solid #ccc; }
  .cell.center > div:nth-child(8) { }
  .cell.center > div:nth-child(9) { border-left: 1px solid #ccc; }

  /* 外框粗邊 2px */
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(2),
  .grid .cell:nth-child(3) { border-top:    2px solid #111; }
  .grid .cell:nth-child(7),
  .grid .cell:nth-child(8),
  .grid .cell:nth-child(9) { border-bottom: 2px solid #111; }
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(4),
  .grid .cell:nth-child(7) { border-left:   2px solid #111; }
  .grid .cell:nth-child(3),
  .grid .cell:nth-child(6),
  .grid .cell:nth-child(9) { border-right:  2px solid #111; }

  /* 四角圓角 12px */
  .grid .cell:nth-child(1) { border-radius: 12px 0 0 0; }
  .grid .cell:nth-child(3) { border-radius: 0 12px 0 0; }
  .grid .cell:nth-child(7) { border-radius: 0 0 0 12px; }
  .grid .cell:nth-child(9) { border-radius: 0 0 12px 0; }

  /* ── 左上格（宮號＋八卦）：col1 row1+row2 ── */
  .cell-left {
    grid-column: 1;
    grid-row: 1;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3px 1px;
    gap: 2px;
  }
  .palace-id { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2px; }
  .palace-num  { font-size: 13px; font-weight: bold; color: #333; line-height: 1.2; }
  .palace-name { font-size: 13px; color: #555; line-height: 1.2; }

  .bagua { display: flex; flex-direction: column; gap: 2px; align-items: center; margin-top: 2px; }
  .bline-full { width: 16px; height: 2px; background: var(--line-color, #444); border-radius: 1px; }
  .bline-broken { display: flex; gap: 3px; }
  .bline-broken span { width: 6px; height: 2px; background: var(--line-color, #444); border-radius: 1px; display: block; }

  /* ── 中欄（神、星、門） ── */
  /* 神：col2 row1 */
  .cell-shen {
    grid-column: 2; grid-row: 1;
    border-bottom: 1px solid #ddd;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }
  /* 星：col2 row2 */
  .cell-star {
    grid-column: 2; grid-row: 2;
    border-bottom: 1px solid #ddd;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333; gap: 2px;
  }
  /* 門：col2 row3 */
  .cell-gate {
    grid-column: 2; grid-row: 3;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── col3 右欄三格 ── */
  /* kong（空亡）：col3 row1 */
  .cell-kong {
    grid-column: 3; grid-row: 1;
    border-left: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }
  /* 天干：col3 row2 */
  .cell-tian {
    grid-column: 3; grid-row: 2;
    border-left: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }
  /* 地干：col3 row3 */
  .cell-di {
    grid-column: 3; grid-row: 3;
    border-left: 1px solid #ddd;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }
  /* r2c1 空白格 */
  .cell-left2 {
    grid-column: 1; grid-row: 2;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
  }
  /* 馬：col1 row3 */
  .cell-ma {
    grid-column: 1; grid-row: 3;
    border-right: 1px solid #ddd;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }

  /* ── 標記（馬、空、凶） ── */
  .tag { font-size: 11px; line-height: 1; margin-top: 1px; }
  .tag.mu   { color: #999; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.xing { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.mu.has-xing  { left: 50%; transform: translateX(-100%); }
  .tag.xing.has-mu  { left: 50%; transform: translateX(0%); right: auto; }
  .stem-mu  { display: inline-block; position: relative; }
  .stem-char { color: #aaa; }
  .stem-char.xing { color: #c0392b; }
  .tag.po   { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.kong {
    color: #c0392b; font-size: 12px; line-height: 1;
    border: 1px solid #c0392b; border-radius: 50%;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .tag.ma {
    color: #2471a3; font-size: 11px; line-height: 1;
    position: relative; display: inline-flex; align-items: center; justify-content: center;
  }
  .tag.ma::before {
    content: '△';
    font-size: 27px;
    color: #2471a3;
    line-height: 1;
    position: absolute;
  }
  .tag.ma span {
    position: relative; z-index: 1;
    font-size: 10px; margin-top: 4px;
  }

  .zhifu-badge {
    font-size: 9px; color: #c0392b;
    border: 1px solid #c0392b;
    padding: 0 2px; border-radius: 2px;
  }

  /* ══════════════════════════════════
     輸入區
  ══════════════════════════════════ */
  hr.divider {
    border: none;
    border-top: 1px solid #ddd;
    margin: 16px 0;
  }
  .input-area {
    width: calc(100% - 44px);
    background: #fff;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 0;
    margin-left: auto;
    margin-right: auto;
  }
  .input-title {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 1px;
  }
  .input-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .input-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .input-row label {
    font-size: 12px;
    color: #aaa;
  }
  .input-row input {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 2px;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
    color: #333;
    -moz-appearance: textfield;
  }
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .input-row input.input-error {
    border: 1px solid #c0392b;
    background: #fdecea;
  }
  .input-error-msg {
    font-size: 13px;
    color: #c0392b;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .input-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn-now {
    background: #fff;
    border: 1.5px solid #888;
    border-radius: 4px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #555;
    cursor: pointer;
  }
  .btn-quick {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 0;
    font-size: 13px;
    font-family: inherit;
    color: #666;
    cursor: pointer;
    flex: 1;
    letter-spacing: .05em;
  }
  .btn-quick-row {
    display: flex;
    gap: 8px;
    margin: 10px 0 0;
  }
  .btn-start {
    background: #444;
    border: none;
    border-radius: 4px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="page">
<!-- 標題 -->
<div style="text-align:center; font-size:18px; font-weight:bold; color:#333; margin: 8px 0 12px; letter-spacing:2px;">陰盤奇門排盤</div>
<!-- 輸入區 -->
<div class="input-area">
  <div class="input-title">起盤時間</div>
  <div class="input-grid">
    <div class="input-row">
      <label>年</label>
      <input type="tel" id="year"  maxlength="4" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>月</label>
      <input type="tel" id="month"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>日</label>
      <input type="tel" id="day"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>時</label>
      <input type="tel" id="hour"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>分</label>
      <input type="tel" id="minute"  maxlength="2" inputmode="numeric">
    </div>
  </div>
  <div class="input-buttons">
    <button class="btn-now" onclick="resetChart()">重置</button>
    <button class="btn-start" onclick="startChart()">排盤</button>
    <button class="btn-now" onclick="setNow()">現時</button>
  </div>
  <div class="input-error-msg" id="input-error-msg"></div>
</div>

<hr class="divider">
<!-- 盤面（預設隱藏）-->
<div id="paipan-result" style="display:block;">

<div class="header">
  <div class="h-col-left">
    <table class="h-table">
      <tr><td class="hl">西元</td><td class="hv" id="sy">—</td><td class="hv" id="sm">—</td><td class="hv" id="sd">—</td><td class="hv" id="st">—</td></tr>
      <tr><td class="hl">農曆</td><td class="hv" id="ly">—</td><td class="hv" id="lm">—</td><td class="hv" id="ld">—</td><td class="hv" id="lt">—</td></tr>
      <tr><td class="hl">天干</td><td class="hv" id="gz-y-gan">—</td><td class="hv" id="gz-m-gan">—</td><td class="hv" id="gz-d-gan">—</td><td class="hv" id="gz-h-gan">—</td></tr>
      <tr><td class="hl">地支</td><td class="hv" id="gz-y-zhi">—</td><td class="hv" id="gz-m-zhi">—</td><td class="hv" id="gz-d-zhi">—</td><td class="hv" id="gz-h-zhi">—</td></tr>
    </table>
  </div>
  <div class="h-col-left2">
    <table class="h-table">
      <tr>
        <td class="hl">陰陽</td>
        <td class="hv">甲乙</td>
        <td class="hv">丙丁</td>
        <td class="hv">戊己</td>
        <td class="hv">庚辛</td>
        <td class="hv">壬癸</td>
      </tr>
    </table>
  </div>
  <div class="h-col-mid">
    <table class="h-table">
      <tr><td class="hl">起局</td><td class="hv" id="hb-qiju">—</td><td class="hl">類型</td><td class="hv" id="hb-fuyin">—</td></tr>
      <tr><td class="hl">旬首</td><td class="hv" id="hb-xun">—</td><td class="hl">符頭</td><td class="hv" id="hb-dutyStem">—</td></tr>
      <tr><td class="hl">值符</td><td class="hv" id="hb-zhifu">—</td><td class="hl">值使</td><td class="hv" id="hb-zhishi">—</td></tr>
      <tr><td class="hl">空亡</td><td class="hv" id="hb-kongwang">—</td><td class="hl">驛馬</td><td class="hv" id="hb-yima">—</td></tr>
    </table>
  </div>
  <div class="h-col-ref">
    <table class="h-table">
      <tr>
        <td class="hl">合干</td>
        <td class="hv">甲己</td>
        <td class="hv">乙庚</td>
        <td class="hv">丙辛</td>
        <td class="hv">丁壬</td>
        <td class="hv">戊癸</td>
      </tr>
    </table>
  </div>
</div>

<div class="outer">

  <div class="yigan yigan-top"    id="yin-9"></div>
  <div class="yigan yigan-bottom" id="yin-1"></div>
  <div class="yigan yigan-left"   id="yin-3"></div>
  <div class="yigan yigan-right"  id="yin-7"></div>
  <div class="yigan yigan-tl"     id="yin-4"></div>
  <div class="yigan yigan-tr"     id="yin-2"></div>
  <div class="yigan yigan-bl"     id="yin-8"></div>
  <div class="yigan yigan-br"     id="yin-6"></div>

  <div class="grid">

    <!-- 4 巽：下斷（下斷，中實，上實） -->
    <div class="cell">
      <div class="cell-left">
        <div class="palace-id"><span class="palace-num" style="color:#4caf50;">4</span><span class="palace-name" style="color:#4caf50;">巽</span></div>
        <div class="bagua" style="--line-color:#4caf50;">
          <div class="bline-full"></div>
          <div class="bline-full"></div>
          <div class="bline-broken"><span></span><span></span></div>
        </div>
      </div>
      <div class="cell-left2"></div>
      <div class="cell-shen" id="sh-4"></div>
      <div class="cell-star" id="star-4"></div>
      <div class="cell-gate" id="gate-4"></div>
      <div class="cell-kong" id="kong-4"></div>
      <div class="cell-tian" id="tian-4"></div>
      <div class="cell-di" id="di-4"></div>
      <div class="cell-ma" id="ma-4"></div>
    </div>

    <!-- 9 離：中虛（下實，中斷，上實） -->
    <div class="cell">
      <div class="cell-left">
        <div class="palace-id"><span class="palace-num" style="color:#c0392b;">9</span><span class="palace-name" style="color:#c0392b;">離</span></div>
        <div class="bagua" style="--line-color:#c0392b;">
          <div class="bline-full"></div>
          <div class="bline-broken"><span></span><span></span></div>
          <div class="bline-full"></div>
        </div>
      </div>
      <div class="cell-left2"></div>
      <div class="cell-shen" id="sh-9"></div>
      <div class="cell-star" id="star-9"></div>
      <div class="cell-gate" id="gate-9"></div>
      <div class="cell-kong" id="kong-9"></div>
      <div class="cell-tian" id="tian-9"></div>
      <div class="cell-di" id="di-9"></div>
      <div class="cell-ma" id="ma-9"></div>
    </div>

    <!-- 2 坤：六斷（全斷） -->
    <div class="cell">
      <div class="cell-left">
        <div class="palace-id"><span class="palace-num" style="color:#a0714f;">2</span><span class="palace-name" style="color:#a0714f;">坤</span></div>
        <div class="bagua" style="--line-color:#a0714f;">
          <div class="bline-broken"><span></span><span></span></div>
          <div class="bline-broken"><span></span><span></span></div>
          <div class="bline-broken"><span></span><span></span></div>
        </div>
      </div>
      <div class="cell-left2"></div>

<script>
// ── 入墓判定 ──
const MU_TABLE = { '癸':2, '乙':6,'丙':6,'戊':6, '丁':8,'己':8,'庚':8, '辛':4,'壬':4 };

// ── 擊刑判定（六儀天干） ──
// 庚在艮(8)、壬在巽(4) 同時符合入墓與擊刑，兩者皆標記，天干顯示為擊刑紅色
const XING_TABLE = { '戊':3, '己':2, '庚':8, '辛':9, '壬':4, '癸':4 };

// 渲染天干字串（含寄干），有入墓或擊刑則標記
// isDutyHouse: 此格是否為符頭天干所在宮位（甲入墓判定用，天盤地盤皆適用）
function renderStemHTML(stem, house, dutyStem, isDutyHouse) {
  if (!stem) return '';
  return stem.split('').map(ch => {
    const isXing = !!XING_TABLE[ch] && XING_TABLE[ch] === house;
    let isMu = MU_TABLE[ch] === house;
    if (!isMu && isDutyHouse && house === 2 && ch === dutyStem) isMu = true;

    if (isXing || isMu) {
      const charClass = isXing ? 'stem-char xing' : 'stem-char';
      const fontSize = (isXing && isMu) ? '7px' : '9px';
      const muTag   = isMu   ? `<span class="tag mu${isXing ? ' has-xing' : ''}" style="font-size:${fontSize};">墓</span>` : '';
      const xingTag = isXing ? `<span class="tag xing${isMu  ? ' has-mu'  : ''}" style="font-size:${fontSize};">刑</span>` : '';
      return `<span class="stem-mu"><span class="${charClass}">${ch}</span>${muTag}${xingTag}</span>`;
    }
    return `<span>${ch}</span>`;
  }).join('');
}

function captureChart() {

// ── 門迫判定 ──
const PO_TABLE = {

function getInputDate() {

}

function setInputDate(dt) {
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('year').value = dt.getFullYear();
  document.getElementById('month').value = pad(dt.getMonth() + 1);
  document.getElementById('day').value = pad(dt.getDate());

function shiftHour(hours) {

// 頁面載入時自動填入當前時間

// 自動跳格
const INPUT_ORDER = ['year','month','day','hour','minute'];
const INPUT_MAXLEN = { year:4, month:2, day:2, hour:2, minute:2 };

INPUT_ORDER.forEach((id, idx) => {
  const el = document.getElementById(id);
  el.addEventListener('input', function() {
    // 只保留數字
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length >= INPUT_MAXLEN[id]) {
      const next = INPUT_ORDER[idx + 1];
      if (next) document.getElementById(next).focus();
    }
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && this.value === '') {
      const prev = INPUT_ORDER[idx - 1];
      if (prev) {
        const prevEl = document.getElementById(prev);
        prevEl.focus();
        // 游標移到末位
        const len = prevEl.value.length;
        prevEl.setSelectionRange(len, len);
      }
    }
  });
});

// 地支序數
const EARTHLY_BRANCHES_REF = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 數字根（各位數相加到一位數，0視為9）
function digitalRoot(n) {
  while (n > 9) {
    n = String(n).split('').reduce((a, b) => a + parseInt(b), 0);
  }
  return n === 0 ? 9 : n;
}

// 取時辰地支
function hourToZhi(h) {
  // 子=23-1, 丑=1-3, ..., 亥=21-23
  const idx = Math.floor((h + 1) / 2) % 12;
  return EARTHLY_BRANCHES_REF[idx];
}

// 判斷陰陽遁：找開盤時間前最近的冬至或夏至
function getSolsticeType(y, m, d, h) {
  const openDate = new Date(y, m-1, d, h);
  
  // 搜尋前兩年到當年的節氣，找最近一個冬至或夏至
  let lastSolstice = null;
  let lastType = null;

  for (let yr = y - 1; yr <= y; yr++) {
    const lunarYr = LunarYear.fromYear(yr);
    const jieQiDays = lunarYr.getJieQiJulianDays();
    const jieQiNames = lunarYr.getJieQiTable ? lunarYr.getJieQiTable() : null;

    // lunar-javascript 節氣順序固定，冬至是第0個，夏至是第12個（從冬至開始算）
    // 用 Solar.fromJulianDay 取得日期，再用 getLunar().getJieQi() 確認名稱
    for (let i = 0; i < jieQiDays.length; i++) {
      const jd = jieQiDays[i];
      const s = Solar.fromJulianDay(jd);
      const name = s.getLunar().getJieQi();
      if (name === '冬至' || name === '夏至') {
        const sDate = new Date(s.getYear(), s.getMonth()-1, s.getDay());
        if (sDate <= openDate) {
          lastSolstice = sDate;
          lastType = name;
        }
      }
    }
  }

  return lastType === '冬至' ? '陽' : '陰';
}

// 計算局數
function getChartNumber(lunar, h, ec) {
  const yearZhi = ec.getYear()[1];       // 年支（節氣換年，取四柱年柱地支）
  const lunarMonth = Math.abs(lunar.getMonth()); // 農曆月
  const lunarDay = lunar.getDay();       // 農曆日
  const hourZhi = hourToZhi(h);         // 時支

  const yearZhiIdx = EARTHLY_BRANCHES_REF.indexOf(yearZhi) + 1;
  const hourZhiIdx = EARTHLY_BRANCHES_REF.indexOf(hourZhi) + 1;

  const sum = yearZhiIdx + lunarMonth + lunarDay + hourZhiIdx;
  return digitalRoot(sum);
}

// 實際順時針／逆時針（八神、八星、天盤天干、引干用）
const HOUSE_CW  = [1, 8, 3, 4, 9, 2, 7, 6]; // 順時針
const HOUSE_CCW = [1, 6, 7, 2, 9, 4, 3, 8]; // 逆時針

// 六儀三奇順序
const EARTH_PLATE_STEM_ORDER = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];

// 九宮完整順序（含5，供路中判斷用）
const HOUSE_NUM_ASC_FULL  = [1, 2, 3, 4, 5, 6, 7, 8, 9]; // 順時針含中宮
const HOUSE_NUM_DESC_FULL = [9, 8, 7, 6, 5, 4, 3, 2, 1]; // 逆時針含中宮

// 地盤固定對應：宮位→九星名稱、八門名稱
const HOUSE_STAR = { 1:'天蓬', 2:'天芮', 3:'天沖', 4:'天輔', 6:'天心', 7:'天柱', 8:'天任', 9:'天英' };
const HOUSE_GATE  = { 1:'休門', 2:'死門', 3:'傷門', 4:'杜門', 6:'開門', 7:'驚門', 8:'生門', 9:'景門' };

// 八神固定順序
const EIGHT_SPIRITS = ['值符','騰蛇','太陰','六合','白虎','玄武','九地','九天'];

// 排八神：時天干宮起，陽遁實際順時針，陰遁實際逆時針
function getSpiritMap(timeStemHouse, yinYang) {
  const order = yinYang === '陽' ? HOUSE_CW : HOUSE_CCW;
  const startIdx = order.indexOf(parseInt(timeStemHouse));
  const result = {};
  for (let i = 0; i < 8; i++) {
    result[order[(startIdx + i) % 8]] = EIGHT_SPIRITS[i];
  }
  return result;
}

// 地支→宮位對應表
const BRANCH_HOUSE = {
  '子':1, '丑':8, '寅':8, '卯':3, '辰':4, '巳':4,
  '午':9, '未':2, '申':2, '酉':7, '戌':6, '亥':6
};

// 馬星：時辰地支→馬星地支
const HORSE_BRANCH_TABLE = {
  '申':'寅', '子':'寅', '辰':'寅',
  '寅':'申', '午':'申', '戌':'申',
  '巳':'亥', '酉':'亥', '丑':'亥',
  '亥':'巳', '卯':'巳', '未':'巳'
};

// 時干序數
const EIGHT_GATES = ['休門','生門','傷門','杜門','景門','死門','驚門','開門'];

// 地盤宮位→八門 index（對應 EIGHT_GATES）
const HOUSE_GATE_IDX = { 1:0, 2:5, 3:2, 4:3, 6:7, 7:6, 8:1, 9:4 };

// 時干序數
const HEAVENLY_STEMS_REF = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

// 排八門：從地盤值使門宮位走步，落點放值使門，其餘實際順時針放入
function getGateMap(dutyGateHouse, yinYang, timeStem) {
  dutyGateHouse = parseInt(dutyGateHouse);
  // 時干序數（甲=1…癸=10），起點算第一步，所以走 steps-1 步
  const steps = HEAVENLY_STEMS_REF.indexOf(timeStem) + 1;
  // 走步用含中宮的九宮數字順序（中宮5為獨立計數站，不可提前併入坤2）
  const walkOrder = yinYang === '陽' ? HOUSE_NUM_ASC_FULL : HOUSE_NUM_DESC_FULL;
  const startIdx = walkOrder.indexOf(dutyGateHouse);
  // 走 steps-1 步（起點算第一步）
  let landGong = walkOrder[(startIdx + steps - 1) % 9];
  // 入中寄坤
  if (landGong === 5) landGong = 2;

  // 值使門的門名 index（中宮無門，查表時用寄坤後的2）
  const shimenMenIdx = HOUSE_GATE_IDX[dutyGateHouse === 5 ? 2 : dutyGateHouse];

  // 從落點起，實際順時針放入八門
  const landIdx = HOUSE_CW.indexOf(landGong);
  const result = {};
  for (let i = 0; i < 8; i++) {
    const gong = HOUSE_CW[(landIdx + i) % 8];
    result[gong] = EIGHT_GATES[(shimenMenIdx + i) % 8];
  }
  return result;
}

// 排引干：值使門落宮起，時天干為頭，沿地盤實際順時針序列切入，永遠順時針放入
// 星伏／門伏：純位置標記（八星/八門是否全部回到固定本宮），畫面顯示用，跟特例三觸發邏輯分開
// 特例三/四觸發前提：① 星伏（isStarFrozen）② 引干閉環（isGuidingClosed，值使門落宮地盤干含effectiveStem）
// 兩個觸發條件都成立才飛布；星伏/門伏的「位置」標記本身不直接決定要不要飛布
function getGuidingStemMap(dutyGateLandHouse, earthStemMap, timeStem, dutyStem, yinYang, timeStemHouse, dutyStemHouse) {
  dutyGateLandHouse = parseInt(dutyGateLandHouse);

  // 決定實際使用的時干（甲不在地盤時改用符頭）
  const effectiveStem = (timeStem === '甲') ? dutyStem : timeStem;

  // 用實際順時針讀出地盤天干序列（8個位置）
  let diSeq = HOUSE_CW.map(g => earthStemMap[g] || '');

  // 星伏（純位置）：時干所在地盤宮位 是否＝符頭所在地盤宮位（八星、天盤天干排列同一起點）
  const isStarFrozen = String(timeStemHouse) === String(dutyStemHouse);

  // 門伏（純位置）：值使門落宮 是否＝值使門固定本宮（＝符頭所在地盤宮位）。八門同一起點同一offset，單點檢查即代表全部八門
  const isGateFrozen = String(dutyGateLandHouse) === String(dutyStemHouse);

  // 引干閉環（觸發特例三用，內容檢查，跟門伏的位置檢查是不同條件）：
  // 值使門落宮的地盤干 是否包含 effectiveStem
  const diStemAtLand = earthStemMap[dutyGateLandHouse] || '';
  const isGuidingClosed = diStemAtLand.includes(effectiveStem);

  const isTripleSame = isStarFrozen && isGuidingClosed;

  let guidingMap;
  if (isTripleSame) {
    const stemOrder = EARTH_PLATE_STEM_ORDER; // 戊己庚辛壬癸丁丙乙
    const walkFull = yinYang === '陽'
      ? [5,6,7,8,9,1,2,3,4]
      : [5,4,3,2,1,9,8,7,6];

    // 飛布函數：將 centerStem 入中宮飛布，回傳 flyMap（中宮寄坤二前）
    function doFlyRaw(centerStem) {
      const centerIdx = stemOrder.indexOf(centerStem);
      const fm = {};
      for (let i = 0; i < 9; i++) {
        const gan = stemOrder[(centerIdx + i) % 9];
        const gong = walkFull[i];
        fm[gong] = (fm[gong] || '') + gan;
      }
      return fm;
    }

    // 特例三：effectiveStem 入中飛布
    let rawMap = doFlyRaw(effectiveStem);

    // 中宮寄坤二
    if (rawMap[5]) {
      rawMap[2] = (rawMap[2] || '') + rawMap[5];
      delete rawMap[5];
    }

    // 特例四：飛布後值使門落宮引干仍含 effectiveStem → 閉環
    // 改用坤二另一個天干入中飛布
    if ((rawMap[dutyGateLandHouse] || '').includes(effectiveStem)) {
      const otherStem = (rawMap[2] || '').split('').find(c => c !== effectiveStem);
      if (otherStem) {
        rawMap = doFlyRaw(otherStem);
        if (rawMap[5]) {
          rawMap[2] = (rawMap[2] || '') + rawMap[5];
          delete rawMap[5];
        }
      }
    }

    guidingMap = {};
    [1,2,3,4,6,7,8,9].forEach(g => { guidingMap[g] = rawMap[g] || ''; });
  } else {
    // 普通情況：從值使門落宮起，以 effectiveStem 為頭，順時針放入
    let headPos = diSeq.findIndex(s => s.includes(effectiveStem));
    if (headPos === -1) headPos = 0;
    const startIdx = HOUSE_CW.indexOf(dutyGateLandHouse);
    guidingMap = {};
    for (let i = 0; i < 8; i++) {
      const gong = HOUSE_CW[(startIdx + i) % 8];
      guidingMap[gong] = diSeq[(headPos + i) % 8];
    }
  }

  return { guidingMap, isStarFrozen, isGateFrozen };
}

const EIGHT_STARS = ['天蓬','天任','天沖','天輔','天英','天芮','天柱','天心'];

// 排八星：地盤時干宮起，值符星為頭，固定蓬任沖輔英芮柱心順時針
function getStarMap(timeStemHouse, dutyStar) {
  const headIdx = EIGHT_STARS.indexOf(dutyStar);
  const startIdx = HOUSE_CW.indexOf(parseInt(timeStemHouse));
  const result = {};
  for (let i = 0; i < 8; i++) {
    result[HOUSE_CW[(startIdx + i) % 8]] = EIGHT_STARS[(headIdx + i) % 8];
  }
  return result;
}

// 排天盤天干：地盤時干宮起，沿地盤實際順時針序列從符頭切入，永遠順時針放入
function getHeavenStemMap(timeStemHouse, earthStemMap, dutyStem) {
  timeStemHouse = parseInt(timeStemHouse);
  // 用實際順時針讀出地盤天干序列（8個位置，寄干宮保留兩個天干）
  const diSeq = HOUSE_CW.map(g => earthStemMap[g] || '');
  // 找符頭所在位置（位置index）
  const headPos = diSeq.findIndex(s => s.includes(dutyStem));
  // 從地盤時干宮起，實際順時針放入天盤
  const startIdx = HOUSE_CW.indexOf(timeStemHouse);
  const result = {};
  for (let i = 0; i < 8; i++) {
    const gong = HOUSE_CW[(startIdx + i) % 8];
    result[gong] = diSeq[(headPos + i) % 8];
  }
  return result;
}

// 排地盤天干
// 回傳 { 宮位數: 天干 }，例如 { 1:'丙', 2:'戊乙', ... }
function getEarthStemMap(yinYang, chartNum) {
  const result = {};
  const order9 = yinYang === '陽' ? HOUSE_NUM_ASC_FULL : HOUSE_NUM_DESC_FULL; // 含5，9格

  // 找戊的起始宮位在9格順序中的 index
  const startIdx = order9.indexOf(chartNum);

  // 9個天干依序排入9格（含中宮5）
  for (let i = 0; i < 9; i++) {
    const gan = EARTH_PLATE_STEM_ORDER[i];
    const gong = order9[(startIdx + i) % 9];
    if (result[gong]) {
      result[gong] = result[gong] + gan;
    } else {
      result[gong] = gan;
    }
  }
  // 中宮5原始天干（寄坤前），第六步排八門的數字走步需要用這個原始位置
  const houseFiveStem = result[5] || null;

  // 排完後，5宮天干寄坤（2）－ 此為「顯示用／空間旋轉用」的合併版本
  if (result[5]) {
    result[2] = result[2] ? result[2] + result[5] : result[5];
    delete result[5];
  }

  return { earthStemMap: result, houseFiveStem };
}

// 根據時柱干支找旬首資料（用完整干支配對）
function getDecInfo(timeStem, timeBranch) {
  const ganIdx = HEAVENLY_STEMS_REF.indexOf(timeStem);
  const zhiIdx = EARTHLY_BRANCHES_REF.indexOf(timeBranch);
  const posInXun = ganIdx; // 在旬中的位置就是天干序號（甲=0, 乙=1, ...）
  const xunFirstZhiIdx = (zhiIdx - posInXun + 12) % 12;
  const xunFirstZhi = EARTHLY_BRANCHES_REF[xunFirstZhiIdx];

  const xunMap = {
    '子': { xun: '甲子旬', dutyStem: '戊', kongwang: ['戌','亥'] },
    '戌': { xun: '甲戌旬', dutyStem: '己', kongwang: ['申','酉'] },
    '申': { xun: '甲申旬', dutyStem: '庚', kongwang: ['午','未'] },
    '午': { xun: '甲午旬', dutyStem: '辛', kongwang: ['辰','巳'] },
    '辰': { xun: '甲辰旬', dutyStem: '壬', kongwang: ['寅','卯'] },
    '寅': { xun: '甲寅旬', dutyStem: '癸', kongwang: ['子','丑'] },
  };
  return xunMap[xunFirstZhi] || null;
}

// 驗證年月日時分是否為合理數字，不合理則標紅對應欄位並顯示訊息
function validateDateInputs(y, m, d, h, min) {
  const fields = [
    { id: 'year', valid: Number.isInteger(y) && y >= 1, msg: '年份須為正整數' },
    { id: 'month', valid: Number.isInteger(m) && m >= 1 && m <= 12, msg: '月份須在1–12之間' },
    { id: 'hour', valid: Number.isInteger(h) && h >= 0 && h <= 23, msg: '時須在0–23之間' },
    { id: 'minute', valid: Number.isInteger(min) && min >= 0 && min <= 59, msg: '分須在0–59之間' },
  ];

  // 日的合理範圍要先確定月份合法才能算當月天數，否則先用31上限粗略檢查
  const daysInMonth = (Number.isInteger(y) && Number.isInteger(m) && m >= 1 && m <= 12)
    ? new Date(y, m, 0).getDate()
    : 31;
  fields.push({ id: 'day', valid: Number.isInteger(d) && d >= 1 && d <= daysInMonth, msg: `日須在1–${daysInMonth}之間` });

  const errorMsgs = [];
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    if (f.valid) {
      el.classList.remove('input-error');
    } else {
      el.classList.add('input-error');
      errorMsgs.push(f.msg);
    }
  });

  const msgEl = document.getElementById('input-error-msg');
  if (msgEl) {
    if (errorMsgs.length) {
      msgEl.textContent = errorMsgs.join('；');
      msgEl.style.display = 'block';
    } else {
      msgEl.textContent = '';
      msgEl.style.display = 'none';
    }
  }

  return errorMsgs.length === 0;
}

function startChart() {
  const y   = parseInt(document.getElementById('year').value);
  const m   = parseInt(document.getElementById('month').value);
  const d   = parseInt(document.getElementById('day').value);
  const h   = parseInt(document.getElementById('hour').value);
  const min = parseInt(document.getElementById('minute').value);

  if (!validateDateInputs(y, m, d, h, min)) {
    return;
  }

  // 子時跨日：23:00-23:59 屬於隔日子時，農曆換算需 +1 天，時辰改為 0
  let lunarD = d, lunarM = m, lunarY = y, lunarH = h;
  if (h === 23) {
    const nextDay = new Date(y, m - 1, d + 1);
    lunarY = nextDay.getFullYear();
    lunarM = nextDay.getMonth() + 1;
    lunarD = nextDay.getDate();
    lunarH = 0;
  }

  const solar = Solar.fromYmdHms(lunarY, lunarM, lunarD, lunarH, min, 0);
  const lunar = solar.getLunar();
  const ec = lunar.getEightChar();

  // 西元
  document.getElementById('sy').textContent = y;
  document.getElementById('sm').textContent = String(m).padStart(2,'0');
  document.getElementById('sd').textContent = String(d).padStart(2,'0');
  document.getElementById('st').textContent = String(h * 100 + min).padStart(4,'0');

  // 農曆
  document.getElementById('ly').textContent = lunar.getYear();
  document.getElementById('lm').textContent = String(Math.abs(lunar.getMonth())).padStart(2,'0');
  document.getElementById('ld').textContent = String(lunar.getDay()).padStart(2,'0');
  document.getElementById('lt').textContent = String(h * 100 + min).padStart(4,'0');

  // 四柱
  const yGZ = ec.getYear();
  const mGZ = ec.getMonth();
  const dGZ = ec.getDay();
  const hGZ = ec.getTime();

  document.getElementById('gz-y-gan').textContent = yGZ[0];
  document.getElementById('gz-y-zhi').textContent = yGZ[1];
  document.getElementById('gz-m-gan').textContent = mGZ[0];
  document.getElementById('gz-m-zhi').textContent = mGZ[1];
  document.getElementById('gz-d-gan').textContent = dGZ[0];
  document.getElementById('gz-d-zhi').textContent = dGZ[1];
  document.getElementById('gz-h-gan').textContent = hGZ[0];
  document.getElementById('gz-h-zhi').textContent = hGZ[1];

  // 陰陽遁 + 局數
  const yinYang = getSolsticeType(y, m, d, h);
  const chartNum = getChartNumber(lunar, h, ec);
  document.getElementById('hb-qiju').textContent = yinYang + chartNum + '局';

  // 排地盤天干
  const { earthStemMap, houseFiveStem } = getEarthStemMap(yinYang, chartNum);
  // 地盤天干寫入將在後面取得 dutyStemHouse 後統一處理（入墓判定需要）

  // 旬首 / 符頭 / 空亡
  const xunInfo = getDecInfo(hGZ[0], hGZ[1]);
  if (xunInfo) {
    document.getElementById('hb-xun').textContent = xunInfo.xun;
    document.getElementById('hb-dutyStem').textContent = xunInfo.dutyStem;
    document.getElementById('hb-kongwang').textContent = xunInfo.kongwang.join('、');

    // 清除所有 kong 與 ma
    [1,2,3,4,6,7,8,9].forEach(g => {
      const kongEl = document.getElementById('kong-' + g);
      if (kongEl) kongEl.innerHTML = '';
      const maEl = document.getElementById('ma-' + g);
      if (maEl) maEl.innerHTML = '';
    });

    // 先計算馬和空的宮位
    const maZhi = HORSE_BRANCH_TABLE[hGZ[1]];
    const maGong = maZhi ? BRANCH_HOUSE[maZhi] : null;
    const kongGongs = xunInfo.kongwang.map(zhi => BRANCH_HOUSE[zhi]);

    // 馬先放（放入 ma- 格）
    if (maGong) {
      const el = document.getElementById('ma-' + maGong);
      if (el) el.innerHTML = '<span class="tag ma"><span>馬</span></span>';
      document.getElementById('hb-yima').textContent = maZhi;
    }

    // 空後放（空在右）
    const marked = new Set();
    xunInfo.kongwang.forEach(zhi => {
      const g = BRANCH_HOUSE[zhi];
      const el = document.getElementById('kong-' + g);
      if (el && !marked.has(g)) {
        el.innerHTML += '<span class="tag kong">空</span>';
        marked.add(g);
      }
    });

    // 值符宮：符頭天干在地盤的宮位
    const dutyStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(xunInfo.dutyStem));

    if (dutyStemHouse) {
      const dutyStar = HOUSE_STAR[dutyStemHouse];
      document.getElementById('hb-zhifu').textContent = dutyStar || '—';
      document.getElementById('hb-zhishi').textContent = HOUSE_GATE[dutyStemHouse] || '—';

      // 地盤時干宮：時柱天干在地盤的宮位
      // 六甲伏吟：時干為甲，甲不在地盤，改用符頭宮位（甲遁伏於值符下）
      let timeStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(hGZ[0]));
      if (!timeStemHouse) timeStemHouse = dutyStemHouse;

      if (timeStemHouse) {
        try {
          // 排八神
          const shenPan = getSpiritMap(timeStemHouse, yinYang);
          // 排八星
          const xingPan = getStarMap(timeStemHouse, dutyStar);
          // 排天盤天干
          const heavenStemMap = getHeavenStemMap(timeStemHouse, earthStemMap, xunInfo.dutyStem);
          // 排八門：值使門地盤宮位
          // 走步起點需用「寄坤前」的原始宮位──若符頭天干恰為中宮5寄坤前的原始天干，
          // 數字走步（含中宮）的起點應為5本身，不可用已合併到坤2的位置（5與2在九宮數字
          // 循環中是不同的計數站，提前合併會讓起點算錯）
          const dutyStemHouseForGate = (houseFiveStem && xunInfo.dutyStem === houseFiveStem) ? 5 : dutyStemHouse;
          const menPan = getGateMap(dutyStemHouseForGate, yinYang, hGZ[0]);
          // 找值使門落宮（天盤使門所在宮位）
          const shimenName = HOUSE_GATE[dutyStemHouse];
          const dutyGateLandHouse = Object.keys(menPan).find(g => menPan[g] === shimenName);
          // 排引干
          const guidingResult = dutyGateLandHouse
            ? getGuidingStemMap(dutyGateLandHouse, earthStemMap, hGZ[0], xunInfo.dutyStem, yinYang, timeStemHouse, dutyStemHouse)
            : { guidingMap: {}, isStarFrozen: false, isGateFrozen: false };
          const guidingStemMap = guidingResult.guidingMap;

          // 伏吟標記顯示：有伏吟顯示星伏／門伏（標紅）；無伏吟則顯示陰盤（沿用原排盤標示位置）
          const fuyinEl = document.getElementById('hb-fuyin');
          if (fuyinEl) {
            const labels = [];
            if (guidingResult.isStarFrozen) labels.push('星伏');
            if (guidingResult.isGateFrozen) labels.push('門伏');
            if (labels.length) {
              fuyinEl.textContent = labels.join('');
              fuyinEl.style.color = '#c0392b';
            } else {
              fuyinEl.textContent = '陰盤';
              fuyinEl.style.color = '';
            }
          }

          [1,2,3,4,6,7,8,9].forEach(g => {
            const shenEl = document.getElementById('sh-' + g);
            const starEl = document.getElementById('star-' + g);
            const tianEl = document.getElementById('tian-' + g);
            const gateEl = document.getElementById('gate-' + g);
            const yinEl  = document.getElementById('yin-' + g);
            const diEl   = document.getElementById('di-' + g);
            if (shenEl) shenEl.textContent = shenPan[g] || '';
            if (starEl) starEl.textContent = xingPan[g] || '';
            // 天盤天干（入墓判定，含甲入墓特例）
            if (tianEl) {
              const isDutyHouse = String(g) === String(timeStemHouse);
              tianEl.innerHTML = renderStemHTML(heavenStemMap[g] || '', g, xunInfo.dutyStem, isDutyHouse);
            }
            if (gateEl) gateEl.innerHTML = renderGateHTML(menPan[g] || '', g);
            // 地盤天干（入墓判定，含甲入墓特例）
            if (diEl) {
              const isDutyHouse = String(g) === String(dutyStemHouse);
              diEl.innerHTML = renderStemHTML(earthStemMap[g] || '', g, xunInfo.dutyStem, isDutyHouse);
            }
            // 引干（不判定四害）
            if (yinEl) {
              const val = guidingStemMap[g] || '';
              if (!val) { yinEl.innerHTML = ''; return; }
              if ((g === 3 || g === 7) && val.length > 1) {
                yinEl.innerHTML = val.split('').map(ch => `<span>${ch}</span>`).join('');
              } else {
                yinEl.textContent = val;
              }
            }
          });
        } catch(e) {
          console.log('ERROR:', e.message, e.stack);
        }
      }
    }
  }

  document.getElementById('paipan-result').style.display = 'block';
  // 截圖按鈕只在桌面或 iPad 顯示（手機用系統截圖即可）
  const isIPad = /iPad/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isDesktop = navigator.maxTouchPoints === 0 || isIPad;
  if (isDesktop) {
    document.getElementById('btn-capture-wrap').style.display = 'block';
  }
  document.getElementById('paipan-result').scrollIntoView({ behavior: 'smooth' });
}
